name: Exact cache ID prune lab
on:
  push:
    branches: [codex/cache-id-prune-lab-20261006]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [upstream, ubuntu]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Empty disposable host and pinned nested Engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          test -z "$(docker ps -aq)"
          docker version > results/host-docker.txt
          uname -a > results/uname.txt
          test "$(uname -m)" = x86_64
          python3 --version > results/python.txt
          sha256sum lab/* .github/workflows/cache-id-prune-lab.yml > results/test-source-sha256.txt
          docker pull docker:29.1.3-dind
          engine_image=docker:29.1.3-dind
          if test '${{ matrix.engine }}' = ubuntu; then
            docker build --progress=plain -f lab/Dockerfile.ubuntu -t cache-lab-ubuntu . 2>&1 | tee results/ubuntu-build.log
            engine_image=cache-lab-ubuntu
          fi
          docker image inspect "$engine_image" > results/dind-image.json
          docker run -d --privileged --name exact-cache-engine --cpus 2 --memory 3g \
            -e DOCKER_TLS_CERTDIR= -p 127.0.0.1:23750:2375 \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/lab" \
            --mount type=volume,src=cache-lab-daemon-root,dst=/var/lib/docker \
            "$engine_image" --host=tcp://0.0.0.0:2375 --host=unix:///var/run/docker.sock \
            --config-file=/lab/lab/daemon.json
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:23750/_ping > results/ping.txt; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
      - name: Real exact-ID tests (no mock)
        shell: bash
        run: |
          set -euo pipefail
          LAB_ENGINE='${{ matrix.engine }}' python3 -u lab/check.py 2>&1 | tee results/full.log
      - name: Collect diagnostics even on failure
        if: always()
        shell: bash
        run: |
          docker logs exact-cache-engine > results/daemon.log 2>&1 || true
          docker inspect exact-cache-engine > results/outer-container.json 2>&1 || true
          find results -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > results/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-cache-id-results-${{ matrix.engine }}
          path: results/
          if-no-files-found: error
          retention-days: 30

name: Clean host handover review
on:
  push:
    branches: [codex/clean-handover-20261008]
    paths: ['tools/clean-install/**', '.github/workflows/clean-handover.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: clean-handover-isolated
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Load exact images without builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq)"
          gh api repos/bassixs/Incident-Management/actions/artifacts/11510892680/zip > verified-images.zip
          echo '1f7c00408d24f7d1b928e5580f25b07b4e169acc6847948a75265ed7c576641b  verified-images.zip' | sha256sum -c -
          mkdir verified-images
          unzip -q verified-images.zip -d verified-images
          echo '0bfa90370526dc2f4110b5d6408d68e6fae58fca440eecf6a90511e147b32a83  verified-images/main-and-reserve.tar.gz' | sha256sum -c -
          docker load -i verified-images/main-and-reserve.tar.gz
          docker pull --platform linux/amd64 postgres:16.15-alpine
          docker pull --platform linux/amd64 caddy:2-alpine
      - name: Check Python syntax
        run: python3 -m compileall -q tools/clean-install
      - name: Actual handover containers
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B -u tools/clean-install/tests/docker_test.py 2>&1 | tee docker-handover.log
      - name: Package exact tested tooling and images
        run: sudo python3 -B tools/clean-install/tests/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: clean-handover-reviewed-kit
          path: clean-package/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clean-handover-evidence-${{ github.sha }}
          path: |
            clean-results/report.json
            clean-results/commands.log
            clean-results/environment.txt
            clean-results/image-ids.json
            clean-results/cleanup.txt
            docker-handover.log
          retention-days: 30

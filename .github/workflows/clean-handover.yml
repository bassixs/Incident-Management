name: Clean host operations review
on:
  push:
    branches: [codex/clean-operations-20261008]
    paths: ['tools/clean-install/**', '.github/workflows/clean-handover.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: clean-handover-isolated
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Load exact images without builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -z "$(docker ps -aq)"
          gh api repos/bassixs/Incident-Management/actions/artifacts/11557056133/zip > previous-kit.zip
          echo '548d3294f28946a24a3ee57572f47ed82066f1793210b6fbdfd9475787971ee9  previous-kit.zip' | sha256sum -c -
          unzip -q previous-kit.zip -d previous-package
          echo 'f5613be1a1c062fe0e9b38fc2bc22ee307f21dd824e6b654c6e46676cbe8d2fc  previous-package/clean-install-reviewed.zip' | sha256sum -c -
          mkdir verified-images
          unzip -q previous-package/clean-install-reviewed.zip -d verified-images
          (cd verified-images && sha256sum -c SHA256SUMS)
          docker load -i verified-images/main-and-reserve.tar.gz
          docker load -i verified-images/postgres-and-caddy.tar.gz
      - name: Check Python syntax
        run: python3 -m compileall -q tools/clean-install
      - name: Actual handover containers
        run: sudo --preserve-env=GITHUB_ACTIONS python3 -B -u tools/clean-install/tests/docker_test.py 2>&1 | tee docker-handover.log
      - name: Package exact tested tooling and images
        run: sudo python3 -B tools/clean-install/tests/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: clean-operations-reviewed-kit
          path: clean-package/
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clean-operations-evidence-${{ github.sha }}
          path: |
            clean-results/report.json
            clean-results/commands.log
            clean-results/environment.txt
            clean-results/image-ids.json
            clean-results/cleanup.txt
            clean-results/*-caddy.log
            clean-results/operations.log
            clean-results/systemd.txt
            docker-handover.log
          retention-days: 30

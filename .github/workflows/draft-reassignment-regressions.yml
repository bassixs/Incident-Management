name: Draft and reassignment regressions
on:
  push:
    branches: [codex/draft-reassignment-regressions]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  baseline:
    if: github.sha == '7b4ede778f42ab4a8814f485781fb9c5f3f151c1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: incident_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synthetic -d incident_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://synthetic:synthetic-only@127.0.0.1:5432/incident_test
      DATABASE_URL: postgresql://synthetic:synthetic-only@127.0.0.1:5432/incident_test
      BOT_TOKEN: synthetic-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dedf2ea43c6bf358b4d780f2a9beee4796a7bcec
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p evidence && git rev-parse HEAD > evidence/runtime-sha.txt
      - run: npm ci && npx prisma generate && npx prisma migrate deploy
      - name: Unmodified tests on exact main
        run: >-
          npx vitest run tests/integration/incident-lifecycle.test.ts tests/integration/staff-reservations.test.ts
          --reporter=default --reporter=json --outputFile=evidence/baseline.json
          2>&1 | tee evidence/baseline.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: exact-main-baseline-${{ github.sha }}
          path: evidence/
          retention-days: 30
  regression:
    if: github.sha != '7b4ede778f42ab4a8814f485781fb9c5f3f151c1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: incident_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synthetic -d incident_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://synthetic:synthetic-only@127.0.0.1:5432/incident_test
      DATABASE_URL: postgresql://synthetic:synthetic-only@127.0.0.1:5432/incident_test
      BOT_TOKEN: synthetic-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p evidence && git rev-parse HEAD > evidence/candidate-sha.txt
      - run: npm ci && npx prisma generate && npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck 2>&1 | tee evidence/typecheck.txt
      - name: Build
        if: success() || failure()
        run: npm run build 2>&1 | tee evidence/build.txt
      - name: Causal comparison with unchanged runtime
        if: success() || failure()
        run: |
          cp src/sector/sector.service.ts "$RUNNER_TEMP/sector-fixed.ts"
          trap 'cp "$RUNNER_TEMP/sector-fixed.ts" src/sector/sector.service.ts' EXIT
          git show dedf2ea43c6bf358b4d780f2a9beee4796a7bcec:src/sector/sector.service.ts > src/sector/sector.service.ts
          git diff --exit-code dedf2ea43c6bf358b4d780f2a9beee4796a7bcec -- src
          set +e
          npx vitest run tests/integration/incident-lifecycle.test.ts tests/integration/staff-reservations.test.ts --reporter=default --reporter=json --outputFile=evidence/causal-base.json 2>&1 | tee evidence/causal-base.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          node -e 'const r=require("./evidence/causal-base.json"); const f=r.testResults.flatMap(x=>x.assertionResults).filter(x=>x.status==="failed"); if(f.length!==2 || f.some(x=>!x.fullName.includes("old publication finishes after reassignment"))) process.exit(1);'
      - name: Both complete files
        if: success() || failure()
        run: >-
          npx vitest run tests/integration/incident-lifecycle.test.ts tests/integration/staff-reservations.test.ts
          --reporter=default --reporter=json --outputFile=evidence/fixed.json
          2>&1 | tee evidence/fixed.txt
      - name: Repeat controlled reassignment race ten times
        if: success() || failure()
        run: |
          for n in $(seq 1 10); do
            npx vitest run tests/integration/staff-reservations.test.ts -t 'old publication finishes after reassignment' --reporter=default --reporter=json --outputFile="evidence/race-$n.json" 2>&1 | tee "evidence/race-$n.txt"
          done
      - name: Unit
        if: success() || failure()
        run: npx vitest run tests/unit --reporter=default --reporter=json --outputFile=evidence/unit.json 2>&1 | tee evidence/unit.txt
      - name: Related draft, routing and delivery scenarios
        if: success() || failure()
        run: >-
          npx vitest run tests/integration/resident-draft-safety.test.ts tests/integration/distribution-queue.test.ts
          tests/integration/private-workspace.test.ts tests/integration/work-queues.test.ts
          tests/integration/transactional-workflow.test.ts tests/integration/delivery-review-regressions.test.ts
          tests/integration/working-deadline-queue.test.ts tests/integration/working-policy.test.ts
          --reporter=default --reporter=json --outputFile=evidence/related.json
          2>&1 | tee evidence/related.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: draft-reassignment-${{ github.sha }}
          path: evidence/
          retention-days: 30

name: Isolated failure boundaries
on:
  push:
    branches: [codex/durable-failure-boundaries]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: synthetic
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: incident_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U synthetic -d incident_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://synthetic:synthetic-only@127.0.0.1:5432/incident_test
      DATABASE_URL: postgresql://synthetic:synthetic-only@127.0.0.1:5432/incident_test
      BOT_TOKEN: synthetic-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npx prisma generate
      - run: npx prisma migrate deploy
      - run: mkdir -p evidence
      - name: Typecheck
        if: always()
        run: npm run typecheck 2>&1 | tee evidence/typecheck.txt
      - name: Build
        if: always()
        run: npm run build 2>&1 | tee evidence/build.txt
      - name: Unit
        if: always()
        run: npx vitest run tests/unit --reporter=default --reporter=json --outputFile=evidence/unit.json 2>&1 | tee evidence/unit.txt
      - name: Integration
        if: always()
        run: >-
          npx vitest run tests/integration/failure-boundaries.test.ts
          tests/integration/transactional-workflow.test.ts tests/integration/retention.test.ts
          tests/integration/reliable-delivery.test.ts tests/integration/delivery-reliability.test.ts
          tests/integration/delivery-review-regressions.test.ts tests/integration/delivery-worker-lifecycle.test.ts
          tests/integration/parallel-outbox.test.ts
          --reporter=default --reporter=json --outputFile=evidence/integration.json
          2>&1 | tee evidence/integration.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: failure-boundaries-${{ github.sha }}
          path: evidence/
          retention-days: 14
